services:
  gosift:
    # tag set explicitly at deploy, never latest
    image: ghcr.io/rawizhere/gosift:${GOSIFT_IMAGE_TAG}
    container_name: gosift
    env_file:
      - ../.env
    environment:
      DB_PATH: /data/gosift.db
    volumes:
      - gosift_data:/data
    restart: unless-stopped

volumes:
  gosift_data:
